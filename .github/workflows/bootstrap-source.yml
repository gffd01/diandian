name: Import and clean upstream source

permissions:
  actions: write
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-source.yml
      - .github/scripts/import-and-customize.sh

concurrency:
  group: import-clean-source
  cancel-in-progress: false

jobs:
  import-source:
    if: github.repository == 'gffd01/diandian'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Import upstream source and remove promotions
        run: .github/scripts/import-and-customize.sh

      - name: Commit complete source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Source is already current."
          else
            git commit -m "Import clean Teminuosi S-UI source"
            git push origin HEAD:main
          fi

      - name: Start release build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "Release workflow is not ready yet; retrying ($attempt/6)..."
            sleep 10
          done
          echo "Could not start the release workflow" >&2
          exit 1
